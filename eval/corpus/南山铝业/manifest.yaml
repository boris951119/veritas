question: 南山铝业2024年：前三季度合计已向全体股东每多少股派发现金红利多少（含税） 。；南山铝业2024年：拟再向全体股东每多少股派发现金红利多少（含税）；南山铝业2024年：累计现金分红比例为多少；南山铝业2024年：高端产品毛利约占公司铝产品总毛利的多少。；南山铝业2024年：公司通过全资子公司出资建设印尼宾坦工业园年产多少吨电解铝、多少吨炭素项目
