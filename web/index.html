<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veritas · 多智能体研判工作台</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2d3646;
  --text:#e6edf3; --dim:#8b97a6; --accent:#4f8cff; --good:#3fb950;
  --warn:#d29922; --bad:#f85149; --chip:#21293a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:60px}
.topbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px}
.logo{font-weight:700;font-size:16px;letter-spacing:.5px}
.logo b{color:var(--accent)}
select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px}
h2{font-size:15px;margin:26px 0 12px;color:var(--dim);font-weight:600;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px}
.row{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.stage{display:flex;align-items:flex-start;gap:0}
.stage .lane{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.link{width:34px;align-self:center;flex:none;border-top:2px dashed var(--line);position:relative}
.link::after{content:"";position:absolute;right:-1px;top:-5px;border:4px solid transparent;border-left-color:var(--line)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:default}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--accent)}
.card .who{color:var(--dim);font-size:11px;margin-top:2px}
.conf{display:flex;align-items:center;gap:8px;margin-top:8px}
.bar{flex:1;height:6px;border-radius:4px;background:#0a0e14;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.conf b{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--dim)}
.evquote{font-size:12.5px;border-left:3px solid var(--accent);padding-left:8px;color:#cdd9e5}
.evops{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.evops input[type=range]{width:90px;accent-color:var(--accent)}
.evops .val{font-size:11px;color:var(--dim);width:26px}
.mini{font-size:11px;padding:3px 8px;border-radius:6px}
.mini.danger:hover{border-color:var(--bad);color:var(--bad)}
.segtext{display:none;margin-top:6px;background:#0a0e14;border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;color:var(--dim)}
.segtext.open{display:block}
.src{border-left:3px solid var(--warn)}
.src .cred{display:flex;align-items:center;gap:6px;margin-top:6px}
.tag{font-size:10px;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--dim)}
.tag.A{color:var(--good);border-color:var(--good)}
.tag.B{color:#58a6ff;border-color:#58a6ff}
.tag.C{color:var(--warn);border-color:var(--warn)}
.tag.D{color:var(--bad);border-color:var(--bad)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec h3{font-size:13px;margin-bottom:8px}
.pair{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.verdict{margin-top:6px;padding:8px;border-radius:8px;background:#12261a;border:1px solid #1f4630;font-size:12.5px}
.verdict.tie{background:#2a230d;border-color:#57491a}
.kv{color:var(--dim);font-size:12px}
.kv b{color:var(--text)}
.dissent{border-left:3px solid var(--warn);padding:8px 12px;background:var(--panel2);border-radius:8px;margin-bottom:6px;font-size:13px}
.rejected{color:var(--dim);font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rejected code{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:10px 18px;font-size:13px;display:none;z-index:99;max-width:80vw}
.empty{color:var(--dim);font-size:12.5px;padding:8px}
.dissent-note{background:#231d2e;border:1px solid #3d3356;border-radius:8px;padding:6px 10px;margin-top:8px;font-size:12px;color:#c9b8f0}
.graph{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.gnode{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;max-width:180px}
.gnode b{display:block;color:var(--dim);font-weight:600;margin-bottom:2px;text-transform:uppercase;font-size:10px}
.gedges{margin-top:10px;font-size:11px;color:var(--dim);max-height:160px;overflow:auto}
.gedges code{color:var(--accent)}
.editrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.editrow input[type=text]{flex:1;min-width:160px;background:#0a0e14;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><b>veritas</b> 研判工作台</div>
  <select id="caseSel"></select>
  <span id="chainPill" class="pill">…</span>
  <button class="primary" onclick="verifyChain()">校验防篡改链</button>
  <button onclick="tamperDemo()">篡改演示（改一字即红）</button>
  <button onclick="resetCase()">重置案例修改</button>
  <span class="sub" id="panelInfo"></span>
</div>
<div class="wrap">
  <h2>推理轨迹图 <span class="sub">结论 → 证据 → 段落 → 信源；含冲突 / 质证 / 裁决节点</span></h2>
  <div id="graph" class="sec"></div>
  <h2>证据链视图 <span class="sub">结论 → 证据（逐字引文）→ 来源原文　·　点击引文卡下钻原文；滑杆改权重、按钮删证据，改动即重算并入链</span></h2>
  <div id="chains"></div>
  <h2>分歧识别与消解 <span class="sub">可人工改写结论文案、推翻裁决（入链）</span></h2>
  <div id="conflicts"></div>
  <h2>少数意见（依规保留）</h2>
  <div id="dissents"></div>
  <h2>被引文核对打回的证据（机械闸）</h2>
  <div id="rejected"></div>
  <h2>信源清单（可信度可调，调整即重算全链）</h2>
  <div id="sources"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let CASES=[],CUR=null,D=null,G=null;
const LV_COLOR={A:"var(--good)",B:"#58a6ff",C:"var(--warn)",D:"var(--bad)"};
const REL_CN={causation:"因果",correlation:"相关",expert_judgment:"专家判断"};
const TYPE_CN={paper:"文献",patent:"专利",report:"报告",news:"新闻",note:"笔记",web:"网页",other:"其他"};
const KIND_CN={conclusion:"结论",evidence:"证据",segment:"段落",source:"信源",
  conflict:"冲突",rebuttal:"质证",arbitration:"仲裁",analyst:"分析师"};
const EDGE_CN={supports:"支撑",cites:"引用",from_source:"属信源",authored_by:"署名",
  conflicts_with:"对立",rebuts:"质证",decides:"裁定"};
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}
function confColor(c){return c>=.5?"var(--good)":c>=.2?"var(--warn)":"var(--bad)"}
async function api(path,opts){const r=await fetch(path,opts);const j=await r.json().catch(()=>({}));
  if(!r.ok){toast(j.detail||r.statusText);throw new Error(j.detail||r.statusText)}return j}

async function boot(){
  CASES=(await api("/api/cases")).cases;
  $("#caseSel").innerHTML=CASES.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}（${c.out_dir}）</option>`).join("")||"<option value=''>（无产物：先跑 pipeline）</option>";
  if(CASES.length){$("#caseSel").value=CASES[0].name;await load()}
}
async function load(){
  CUR=$("#caseSel").value;if(!CUR)return;
  D=await api("/api/dossier?case="+encodeURIComponent(CUR));
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>({nodes:[],edges:[]}));
  render();
}
function render(){
  const d=D.dossier;
  $("#panelInfo").textContent=`编队 ${d.panel.join("、")||"N/A"} · ${d.sources.length} 信源 · ${d.evidences.length} 证据 · ${d.conclusions.length} 结论`;
  const pill=$("#chainPill");
  pill.textContent=D.chain.ok?`防篡改链 ✅ ${D.chain.n_records} 条`:`防篡改链 ❌ #${D.chain.bad_index}`;
  pill.className="pill "+(D.chain.ok?"ok":"bad");
  renderGraph(G);renderChains(d);renderConflicts(d);renderDissents(d);renderRejected(d);renderSources(d);
}
function renderGraph(g){
  if(!g||!(g.nodes||[]).length){$("#graph").innerHTML=`<div class="empty">无图数据</div>`;return}
  const order=["conclusion","conflict","arbitration","rebuttal","evidence","segment","source","analyst"];
  const nodes=[...g.nodes].sort((a,b)=>order.indexOf(a.kind)-order.indexOf(b.kind));
  const shown=nodes.filter(n=>["conclusion","conflict","arbitration","rebuttal","source","analyst"].includes(n.kind));
  const label=id=>{const n=(g.nodes||[]).find(x=>x.id===id);const t=(n&&n.label||"").trim();
    return t?(t.length>16?t.slice(0,16)+"…":t):id};
  $("#graph").innerHTML=`<div class="kv">节点 ${g.nodes.length} · 边 ${g.edges.length}</div>
    <div class="graph" style="margin-top:8px">${shown.map(n=>`<div class="gnode"><b>${KIND_CN[n.kind]||n.kind}</b>${esc(n.label)}</div>`).join("")}</div>
    <div class="gedges">${(g.edges||[]).slice(0,40).map(e=>`<div><code>${EDGE_CN[e.kind]||e.kind}</code> ${esc(label(e.source))} → ${esc(label(e.target))}</div>`).join("")}
      ${(g.edges||[]).length>40?`<div class="sub">… 另有 ${(g.edges.length-40)} 条边</div>`:""}</div>`;
}
function renderChains(d){
  const majors=d.conclusions.filter(c=>c.status==="majority")
    .sort((a,b)=>b.confidence-a.confidence);
  const mergedCount=id=>d.conclusions.filter(c=>c.status==="merged"&&
    (c.evidence_ids||[]).length===0).length; // 信息量有限，仅展示计数
  $("#chains").innerHTML=majors.map(con=>{
    const evs=d.evidences.filter(e=>e.conclusion_id===con.id);
    const p=con.confidence_parts||{};
    const chips=["强度 "+(p.strength??"-"),"覆盖 "+(p.coverage??"-"),"一致性 "+(p.agreement??"-"),
      `${p.n_evidence??evs.length} 证`].map(t=>`<span class="chip">${esc(t)}</span>`).join("");
    const evHtml=evs.map(ev=>{
      const segs=ev.segment_ids.map(sid=>{
        const seg=findSeg(d,sid);
        if(!seg)return "";
        return `<div class="card src"><div class="kv"><b>${esc(sid)}</b>（${esc(seg.locator)}）</div>
          <button class="mini click" style="margin-top:4px" onclick="this.nextElementSibling.classList.toggle('open')">展开原文</button>
          <div class="segtext">${esc(seg.text)}</div></div>`;
      }).join("");
      return `<div class="card click" data-ev="${esc(ev.id)}">
        <div class="evquote">${esc(ev.quote)}</div>
        <div class="chips"><span class="tag ${esc(ev.level)}">${esc(ev.level)} 级</span>
          <span class="chip">${REL_CN[ev.relation]||ev.relation}</span>
          <span class="chip">权重 ${ev.weight}</span>${ev.author?`<span class="chip">${esc(ev.author)}</span>`:""}</div>
        ${ev.note?`<div class="who">${esc(ev.note)}</div>`:""}
        <div class="evops"><span class="sub">权重</span>
          <input type="range" min="0" max="2" step="0.1" value="${ev.weight}"
            oninput="this.nextElementSibling.textContent=this.value" onchange="setWeight('${esc(ev.id)}',this.value)">
          <span class="val">${ev.weight}</span>
          <button class="mini danger" onclick="removeEv('${esc(ev.id)}')">删除证据</button></div>
        <div style="margin-top:8px" class="lane">${segs}</div>
      </div>`;
    }).join("")||`<div class="empty">（无存活证据）</div>`;
    return `<div class="row"><div class="stage">
      <div class="lane"><div class="card" style="border-left:3px solid ${confColor(con.confidence)}">
        <div>${esc(con.statement)}</div>
        <div class="conf"><b style="color:${confColor(con.confidence)}">${con.confidence.toFixed(2)}</b>
          <div class="bar"><i style="width:${(con.confidence*100).toFixed(0)}%;background:${confColor(con.confidence)}"></i></div></div>
        <div class="chips">${chips}</div>
        <div class="who">研判方：${esc((con.authors&&con.authors.length?con.authors.join("、"):con.author)||"N/A")}</div>
        <div class="editrow">
          <input type="text" id="edit-${esc(con.id)}" value="${esc(con.statement)}" placeholder="改写结论文案">
          <button class="mini" onclick="editCon('${esc(con.id)}')">保存结论</button>
        </div>
      </div></div>
      <div class="link"></div>
      <div class="lane">${evHtml}</div>
      <div class="link"></div>
      <div class="lane sub" style="justify-content:center;padding:6px">原文段落<br>在证据卡内下钻</div>
    </div></div>`;
  }).join("")||`<div class="sec empty">无多数结论</div>`;
}
function findSeg(d,sid){for(const s of d.sources){const seg=(s.segments||[]).find(x=>x.id===sid);if(seg)return seg}return null}
function renderConflicts(d){
  $("#conflicts").innerHTML=(d.conflicts||[]).map(c=>{
    const r=c.resolution;
    let verdict=`<div class="empty">未消解（仲裁不可用，双方并列保留）</div>`;
    if(r){
      const winTxt=r.winner_id==="tie"?"未决（tie，证据势均力敌）":
        `胜方 <b>${esc(r.winner_id)}</b>：${esc(statementOf(d,r.winner_id))}`;
      verdict=`<div class="verdict ${r.winner_id==="tie"?"tie":""}"><b>裁决</b>：${winTxt}<br>
        <span class="kv">理由：${esc(r.rationale)}　·　证据强度对比 <b>${esc(JSON.stringify(r.evidence_weight))}</b></span>
        ${r.rebuts&&Object.keys(r.rebuts).length?`<div class="kv" style="margin-top:4px">质证：${Object.entries(r.rebuts).map(([k,v])=>esc(k)+"方「"+esc(String(v).slice(0,80))+"…」").join("；")}</div>`:""}
      </div>`;
    }
    return `<div class="pair"><b>冲突：${esc(c.topic||"结论对立")}</b>
      <div class="kv">甲方 ${esc(c.a_id)}：${esc(statementOf(d,c.a_id))}</div>
      <div class="kv">乙方 ${esc(c.b_id)}：${esc(statementOf(d,c.b_id))}</div>${verdict}
      <div class="editrow">
        <button class="mini" onclick="overrideWin('${esc(c.id)}','${esc(c.a_id)}')">判甲方胜</button>
        <button class="mini" onclick="overrideWin('${esc(c.id)}','${esc(c.b_id)}')">判乙方胜</button>
        <button class="mini" onclick="overrideWin('${esc(c.id)}','tie')">判未决</button>
      </div></div>`;
  }).join("")||`<div class="sec empty">本轮研判无冲突对</div>`;
}
function statementOf(d,id){const c=(d.conclusions||[]).find(x=>x.id===id);return c?c.statement:"（已不存在）"}
function renderDissents(d){
  const ds=d.conclusions.filter(c=>c.status==="dissent");
  $("#dissents").innerHTML=ds.map(c=>`<div class="dissent">「${esc(c.statement)}」
    <span class="sub">研判方 ${esc((c.authors&&c.authors.length?c.authors.join("、"):c.author)||"N/A")}</span>
    ${(c.dissent||[]).map(x=>`<div class="dissent-note">仲裁记录：${esc(x.why||"")}</div>`).join("")}
    </div>`).join("")||`<div class="sec empty">无少数意见（无仲裁落败结论）</div>`;
}
function renderRejected(d){
  $("#rejected").innerHTML=(d.rejected||[]).map(r=>`<div class="rejected">
    <code>${esc(r.evidence_id)}</code>　${esc((r.problems||[]).join("；"))}<br>
    <span class="sub">引文：${esc(String(r.quote).slice(0,80))}…（结论 ${esc(r.conclusion_id)}）</span></div>`).join("")
    ||`<div class="sec empty">无打回记录——全部证据通过逐字引文核对</div>`;
}
function renderSources(d){
  $("#sources").innerHTML=d.sources.map(s=>`<div class="card" style="margin-bottom:8px">
    <b>${esc(s.title||s.id)}</b>　<span class="tag">${TYPE_CN[s.source_type]||s.source_type}</span>
    <span class="chip">${esc(s.id)}</span>
    <div class="cred"><span class="sub">可信度</span>
      <input type="range" min="0" max="1" step="0.05" value="${s.credibility}"
        oninput="this.nextElementSibling.textContent=this.value" onchange="setCred('${esc(s.id)}',this.value)">
      <span class="val">${s.credibility}</span>
      <span class="sub">（${(s.segments||[]).length} 段）</span></div>
  </div>`).join("")||`<div class="sec empty">无信源</div>`;
}
async function setWeight(id,w){
  D=await api("/api/evidence/weight",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR,evidence_id:id,weight:parseFloat(w)})});
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>G);
  render();toast(`已调整权重并重算（入链 ${D.chain.n_records} 条）`);
}
async function removeEv(id){
  if(!confirm("确认删除该证据？结论置信度将即时重算，操作记入防篡改链。"))return;
  D=await api("/api/evidence/remove",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR,evidence_id:id})});
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>G);
  render();toast("证据已删除并重算（入链）");
}
async function setCred(id,v){
  D=await api("/api/source/credibility",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR,source_id:id,credibility:parseFloat(v)})});
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>G);
  render();toast("信源可信度已更新并重算全链（入链）");
}
async function editCon(id){
  const el=document.getElementById("edit-"+id);if(!el)return;
  D=await api("/api/conclusion/edit",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR,conclusion_id:id,statement:el.value})});
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>G);
  render();toast("结论已改写并入链");
}
async function overrideWin(cid,winner){
  D=await api("/api/conflict/override",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR,conflict_id:cid,winner_id:winner})});
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>G);
  render();toast("人工裁决已落卷并入链");
}
async function resetCase(){
  if(!confirm("撤销本案例的全部人工修改，还原到管线产物？重置动作会记入防篡改链。"))return;
  D=await api("/api/case/reset",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR})});
  G=await api("/api/reasoning_graph?case="+encodeURIComponent(CUR)).catch(()=>G);
  render();toast("已还原到管线产物（重置动作入链）");
}
async function verifyChain(){
  const r=await api("/api/chain/verify",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR})});
  toast(r.ok?`哈希链校验通过（${r.n_records} 条记录，改一字即红）`
    :`校验失败！#${r.bad_index}: ${r.reason}`);
  $("#chainPill").className="pill "+(r.ok?"ok":"bad");
}
async function tamperDemo(){
  const r=await api("/api/chain/tamper_demo",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({case:CUR})});
  if(r.honest_ok&&!r.tampered_ok){
    toast(`演示成功：原链校验 ✅ → 在内存副本把「${r.tampered_record_event}」记录的负载改一个字段 → 校验 ❌ 坏于第 ${r.bad_index} 条（${r.reason}）。磁盘文件未被改动。`,6000);
  }else{toast("演示异常："+JSON.stringify(r))}
}
$("#caseSel").addEventListener("change",load);
boot();
</script>
</body>
</html>
